<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b12">
<title>MiniDrama TV</title>
<style>
:root{color-scheme:dark;--bg:#0b0b12;--panel:#191923;--accent:#ff3764;--muted:#c0bfd0}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:var(--bg);color:#fff;font:20px Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 3vw;background:linear-gradient(110deg,#3a102b,#141827);border-bottom:2px solid #343443}
.brand{font-size:30px;font-weight:800;white-space:nowrap}.brand span{color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:17px;font-weight:bold;cursor:pointer}
button.secondary{background:#343445}
button:focus{outline:4px solid #ffcf48;outline-offset:2px}
#status{font-size:14px;color:var(--muted);margin:0;padding:6px 3vw;background:#11111a;flex:0 0 auto}
#framewrap{position:relative;flex:1 1 auto;min-height:0;background:#111;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
#notice{position:absolute;left:12px;right:12px;bottom:12px;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.78);color:#eee;font-size:13px;pointer-events:none}
@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.brand{font-size:25px}button{font-size:15px;padding:9px 12px}}
</style>
</head>
<body>
<header>
  <div class="brand">MiniDrama<span> TV</span></div>
  <div class="actions">
    <button id="reload" class="secondary" type="button">Recargar DramaBox</button>
    <button id="focusSite" type="button">Ir al contenido</button>
  </div>
</header>
<p id="status" role="status">Intentando cargar DramaBox dentro de MiniDrama TV…</p>
<div id="framewrap">
  <iframe id="site"
    title="DramaBox dentro de MiniDrama TV"
    src="https://www.dramabox.com/es"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="notice">Si el sitio no permite interacción o reproducción integrada, es una restricción de DramaBox o del motor webOS; esta app no puede eliminarla.</div>
</div>
<script>
(function(){
  'use strict';
  var frame = document.getElementById('site');
  var status = document.getElementById('status');
  var reloadButton = document.getElementById('reload');
  var focusButton = document.getElementById('focusSite');
  var buttons = [reloadButton, focusButton];
  var current = 0;

  function focusButtonAt(i){
    current = (i + buttons.length) % buttons.length;
    buttons[current].focus();
  }

  reloadButton.addEventListener('click', function(){
    status.textContent = 'Recargando DramaBox dentro de la aplicación…';
    try { frame.src = 'https://www.dramabox.com/es'; }
    catch(e) { status.textContent = 'No se pudo recargar DramaBox.'; }
  });

  focusButton.addEventListener('click', function(){
    // Mover el foco al contexto del iframe sin navegar fuera de la app.
    try { frame.focus(); } catch(e) {}
    status.textContent = 'Contenido seleccionado. Usa las flechas y OK; la interacción depende del sitio y de webOS.';
  });

  buttons.forEach(function(button, i){
    button.addEventListener('focus', function(){ current = i; });
  });

  window.addEventListener('keydown', function(event){
    var key = event.key;
    if (key === 'Escape' || key === 'Back' || key === 'BrowserBack') {
      // No reemplazar la app ni abrir navegador externo.
      event.preventDefault();
      focusButtonAt(0);
      return;
    }
    if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(key)) return;

    // Cuando el foco está dentro del iframe, no interceptar las flechas:
    // el contenido debe recibirlas si el navegador/webOS lo permite.
    if (document.activeElement === frame) return;

    event.preventDefault();
    if (key === 'ArrowRight' || key === 'ArrowDown') focusButtonAt(current + 1);
    else focusButtonAt(current - 1);
  });

  frame.addEventListener('load', function(){
    status.textContent = 'DramaBox respondió a la carga. Esto no garantiza que permita interacción o reproducción dentro de un iframe.';
  });
  frame.addEventListener('error', function(){
    status.textContent = 'No se pudo cargar DramaBox dentro de la aplicación.';
  });

  focusButtonAt(0);
})();
</script>
</body>
</html>
